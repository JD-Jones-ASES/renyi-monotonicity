version: v0.4
project:
  name: Rényi and Tsallis entropy monotonicity for Bernoulli sums
  description: >-
    Lean formalization of coordinatewise Rényi and Tsallis entropy
    monotonicity for finite independent Bernoulli sums on the closed half cube,
    for every real order in [0,2], as stated in Hillion-Johnson Conjecture 4.4.
    The complete core proves both entropy comparisons and the finite
    inverse-score association inequality. Concrete coefficient-law and entropy
    definitions are checked separately. VERIFICATION.md defines exact-source
    Linux acceptance and distinguishes historical association-only checkpoints.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.PR, cs.IT]
  msc2020: ["60E15", "94A17", "60G50"]
sources:
  - title: A proof of the Shepp-Olkin entropy monotonicity conjecture
    type: paper
    authors: [Erwan Hillion, Oliver Johnson]
    relationship: formalizes
    id: https://arxiv.org/abs/1810.09791v1
    note: >-
      Conjecture 4.4 is the full formalized target. Proposition 2.8, Theorem 3.6
      with strictness, and Appendix A identities are attributed mathematical
      proof inputs proved in the implementation. Published endpoint results and the counterexamples
      above order two are credited to this source.
  - title: Correlation inequalities on some partially ordered sets
    type: paper
    authors: [C. M. Fortuin, P. W. Kasteleyn, J. Ginibre]
    relationship: background
    id: https://doi.org/10.1007/BF01651330
    note: Mathlib's proved finite FKG theorem supplies the classical association step.
automation:
  methods:
    - method: agent
      models: [OpenAI GPT-6 Astra]
      framework: OpenAI Codex
      notes: >-
        Agents contributed research, Lean proofs, documentation and verification
        tooling. See Disclosure.md. Supporting symbolic computations are not
        trusted proof inputs.
review:
  status: agent-reviewed
  reviewers: [OpenAI GPT-6 Astra agents]
  notes: >-
    Written arguments and the complete formal statement and proof boundaries
    received independent agent audits. No human specialist review is claimed.
fidelity:
  divergences: >-
    Literal coefficient-law and entropy definitions preserve all dimensions,
    real orders and closed parameter boundaries. Full entropy monotonicity is
    proved without structural or analytic premises beyond the stated bounds.
    The full Comparator contract checks three principal theorems and eight
    definition equations. Quantitative gain, equality, unique fair maximization
    and continuous-law association remain written extensions outside this
    initial formal contract. Formal verification does not establish novelty,
    human peer review, public release, submission or registration.
