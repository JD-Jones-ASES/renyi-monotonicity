name: Validate Palomar metadata

on:
  push:
    paths: ['formalization.yaml', '.github/workflows/metadata.yml']
  pull_request:
    paths: ['formalization.yaml', '.github/workflows/metadata.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read the pinned official Palomar contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: _palomar-metadata-contract
          persist-credentials: false
      - name: Read the pinned upstream metadata schema
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mathlib-initiative/formalization.yaml
          ref: 99c678e569c7c4c0772db297c5ddd5e4c9b6322e
          path: _formalization-schema
          persist-credentials: false
      - name: Validate schema, required fields, and normalized provenance
        env:
          PYTHONPATH: _palomar-metadata-contract
        run: |
          python3 -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import jsonschema
          from scripts.submission_contract import load_formalization_metadata, normalized_provenance
          data = load_formalization_metadata(Path('formalization.yaml'))
          schema = json.loads(Path('_formalization-schema/schema/v0.4.schema.json').read_text())
          jsonschema.validate(data, schema)
          print(json.dumps(normalized_provenance(data), indent=2))
          print('Palomar metadata and upstream v0.4 schema passed')
          PYTHON
      - name: Read the pinned official Palomar intake parser
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: PalomarRegistry/PalomarServer
          ref: 019205bf1f96531df08da742d80e4218373f7dd8
          path: _palomar-intake-contract
          persist-credentials: false
      - name: Validate metadata with the submission form parser
        run: |
          # YAML 1.2 reads unquoted MSC codes such as 60E15 as numbers.
          npm install --prefix _palomar-intake-contract/.metadata-runtime --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.0
          ln -s .metadata-runtime/node_modules _palomar-intake-contract/node_modules
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { validateFormalization } from './_palomar-intake-contract/browser/preflight.js';
          const diagnostics = validateFormalization(readFileSync('formalization.yaml', 'utf8'));
          assert.deepEqual(diagnostics, [], JSON.stringify(diagnostics, null, 2));
          console.log('Palomar submission form metadata checks passed');
          JAVASCRIPT
